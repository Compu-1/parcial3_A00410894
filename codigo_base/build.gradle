plugins {
    id 'com.zeroc.gradle.ice-builder.slice' version '1.5.0' apply false
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        implementation 'com.zeroc:ice:3.7.10'
        testImplementation 'junit:junit:4.13.2'
    }

    test {
        testLogging {
            events "passed", "failed", "skipped"
        }
    }
}

tasks.register('runServer') {
    group = 'application'
    description = 'Ejecuta el servidor ZeroC Ice de Reserva de Boletas (TCP 10000 + WebSocket 10002)'
    dependsOn ':server:runServer'
}

tasks.register('runClient') {
    group = 'application'
    description = 'Ejecuta el cliente Java de prueba de Reserva de Boletas'
    dependsOn ':client:runClient'
}
