plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'co.icesi.booking.server.BookingServerApp'
}

task runServer(type: JavaExec) {
    mainClass = 'co.icesi.booking.server.BookingServerApp'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
}
